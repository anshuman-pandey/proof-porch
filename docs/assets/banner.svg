<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc"><title id="title">Proof Porch</title><desc id="desc">Collect with consent. Publish with care.</desc><rect width="1280" height="340" rx="24" fill="#173e34"/><text x="64" y="70" fill="#d3dfce" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">PROOF PORCH</text><text x="60" y="160" fill="#fffaf0" font-family="Georgia,serif" font-size="54">Good words deserve a home.</text><text x="64" y="216" fill="#e4e8df" font-family="Arial,sans-serif" font-size="24">Collect with consent. Publish with care.</text><text x="64" y="285" fill="#c8d2c6" font-family="Arial,sans-serif" font-size="17">OPEN SOURCE / MIT LICENSED / YOUR DATA</text><path d="M1120 60h70v220h-70z" fill="none" stroke="#c8d2c6" stroke-width="2" opacity=".5"/><path d="M1100 80h70v220h-70z" fill="none" stroke="#c8d2c6" stroke-width="2" opacity=".4"/></svg>
services:
  app:
    build: .
    image: testimonial-cabinet:local
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set a stable random SECRET_KEY}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set the owner password hash}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      DATABASE: /app/data/proof.sqlite
    volumes:
      - data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/',timeout=3).read()"]
      interval: 3s
      timeout: 4s
      retries: 15
      start_period: 5s
volumes:
  data:

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ board.name }} — Testimonials</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main><p class="eyebrow"><span data-i18n="CUSTOMER STORIES">CUSTOMER STORIES</span></p><h1>{{ board.name }}</h1><section class="grid">{% for row in rows %}<article><blockquote>“{{ row.quote }}”</blockquote><b>{{ row.name }}</b><p>{{ row.role }}</p></article>{% else %}<p><span data-i18n="No published testimonials yet.">No published testimonials yet.</span></p>{% endfor %}</section></main><script src="/static/messages.js"></script><script src="/static/i18n.js"></script></body></html>
